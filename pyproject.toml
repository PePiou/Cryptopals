[project]
name = "cryptopals"
version = "0.1.0"
description = "Python solutions to the Cryptopals cryptography challenges"
readme = "README.md"
authors = [
    { name = "PePiou", email = "mondolonihugo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pycryptodome>=3.24.1",
]

[dependency-groups]
dev = ["pytest>=9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "set1", "set2", "set3", "set4", "set5"]
python_files = ["test*.py"]
norecursedirs = [".git", ".venv", "venv", "__pycache__", ".pytest_cache"]
